name: Unreal Engine container probe

on:
  workflow_dispatch:
  push:
    branches: [unreal-bootstrap]
    paths:
      - ".github/workflows/unreal-container-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check runner capacity
        run: |
          nproc
          free -h
          df -h /
          docker version

      - name: Pull public prebuilt Unreal Engine 5.5.4 image
        run: docker pull wukakuki/unreal-engine:dev-slim-5.5.4

      - name: Inspect engine and Android toolchain
        run: |
          docker run --rm --entrypoint bash wukakuki/unreal-engine:dev-slim-5.5.4 -lc '
            set -e
            echo "=== ENGINE BINARIES ==="
            find / -maxdepth 6 -type f -name UnrealEditor-Cmd 2>/dev/null | head -10
            echo "=== ANDROID SDK/NDK ==="
            find /home /opt /usr/local -maxdepth 6 \( -name sdkmanager -o -name ndk-build -o -name android.jar \) 2>/dev/null | head -40 || true
            echo "=== SDK ENVIRONMENT ==="
            env | sort | grep -Ei "ANDROID|JAVA|NDK|SDK" || true
          '
          echo "=== REMAINING RUNNER DISK ==="
          df -h /
