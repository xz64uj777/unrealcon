name: UnrealCon Android build

on:
  workflow_dispatch:
  push:
    branches: [unreal-bootstrap]
    paths:
      - ".github/workflows/unreal-container-probe.yml"
      - "Source/**"
      - "Config/**"
      - "UnrealCon.uproject"

permissions:
  contents: read

concurrency:
  group: unrealcon-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out UnrealCon project
        uses: actions/checkout@v4

      - name: Install Java 21 for Unreal Engine 5.5
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Unreal Engine 5.5 Android toolchain
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;25.1.8937393"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDKROOT=$SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"
          java -version
          df -h /

      - name: Pull public prebuilt Unreal Engine 5.5.4 image
        run: docker pull wukakuki/unreal-engine:dev-slim-5.5.4

      - name: Compile UnrealCon and package Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          JAVA_HOME_HOST="$JAVA_HOME"
          test -d "$SDK_ROOT/ndk/25.1.8937393"
          test -x "$JAVA_HOME_HOST/bin/java"
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$SDK_ROOT:/opt/android-sdk" \
            -v "$JAVA_HOME_HOST:/opt/java" \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_SDK_ROOT=/opt/android-sdk \
            -e NDKROOT=/opt/android-sdk/ndk/25.1.8937393 \
            -e NDK_ROOT=/opt/android-sdk/ndk/25.1.8937393 \
            -e JAVA_HOME=/opt/java \
            -e PATH="/opt/java/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --entrypoint bash wukakuki/unreal-engine:dev-slim-5.5.4 -lc '
              set -e
              UE=/home/ue4/UnrealEngine
              echo "=== TOOLCHAIN ==="
              java -version
              test -x /opt/android-sdk/ndk/25.1.8937393/ndk-build
              test -f /opt/android-sdk/platforms/android-34/android.jar
              echo "=== EDITOR COMPILE ==="
              "$UE/Engine/Build/BatchFiles/Linux/Build.sh" UnrealConEditor Linux Development -Project=/workspace/UnrealCon.uproject -NoHotReloadFromIDE
              echo "=== ANDROID PACKAGE ==="
              "$UE/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
                -project=/workspace/UnrealCon.uproject \
                -target=UnrealCon \
                -noP4 -platform=Android -clientconfig=Development \
                -cook -build -stage -pak -archive \
                -archivedirectory=/workspace/Artifacts \
                -cookflavor=ASTC -utf8output -unattended
              echo "=== APK OUTPUT ==="
              find /workspace/Artifacts -type f -name "*.apk" -printf "%p %s bytes\\n"
              test "$(find /workspace/Artifacts -type f -name "*.apk" | wc -l)" -gt 0
            '

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: UnrealCon-Android-APK
          path: Artifacts/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report runner disk
        if: always()
        run: df -h /
